<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="レジ">
  <title>模擬店レジ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- Screen A: 担当者選択 -->
<div id="screen-staff" class="screen">
  <div style="font-size:48px;text-align:center">🏪</div>
  <h2>担当者を選んでください</h2>
  <p>済々黌東京同窓会2026</p>
  <div id="staff-grid" class="staff-grid">
    <p class="loading">読み込み中...</p>
  </div>
</div>

<!-- Screen B: 販売メイン -->
<div id="screen-main" class="screen">
  <header class="app-header">
    <h1>模擬店レジ</h1>
    <span id="staff-display" class="staff-name"></span>
    <button id="change-staff-btn" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">変更</button>
    <span id="pending-badge" class="pending-badge"></span>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="products">🛒 商品</button>
    <button class="tab-btn" data-tab="stock">📦 在庫</button>
  </nav>

  <!-- Tab: Products -->
  <div id="tab-products" class="main-scroll">
    <button id="scan-btn" class="scan-btn">
      <span>📷</span> バーコードスキャン
    </button>
    <div id="product-grid" class="product-grid">
      <p class="loading">商品を読み込み中...</p>
    </div>
  </div>

  <!-- Tab: Stock -->
  <div id="tab-stock" class="main-scroll hidden">
    <div id="stock-list"></div>
  </div>

  <!-- Cart Footer -->
  <div id="cart-footer" class="cart-footer empty">
    <div>
      <div class="cart-count" id="cart-count">0点</div>
    </div>
    <div class="cart-total" id="cart-total">¥0</div>
    <div class="cart-cta">会計へ →</div>
  </div>
</div>

<!-- Screen C: 会計確認 -->
<div id="screen-checkout" class="screen">
  <div class="checkout-header">
    <button id="back-btn" class="back-btn">←</button>
    <h2>会計確認</h2>
  </div>
  <div class="checkout-body">
    <div id="checkout-items"></div>

    <div class="payment-section">
      <h3>決済方法</h3>
      <div class="payment-grid">
        <button class="payment-btn" data-payment="cash">
          <span class="p-icon">💴</span>現金
        </button>
        <button class="payment-btn" data-payment="ic">
          <span class="p-icon">📱</span>交通系IC
        </button>
        <button class="payment-btn" data-payment="qr">
          <span class="p-icon">🔲</span>QRコード
        </button>
        <button class="payment-btn" data-payment="card">
          <span class="p-icon">💳</span>クレジット
        </button>
      </div>
    </div>

    <div class="checkout-total">
      <span class="total-label">合計</span>
      <span class="total-amount" id="checkout-total-amount">¥0</span>
    </div>

    <button id="record-btn" class="record-btn" disabled>記録する</button>
  </div>
</div>

<!-- Screen D: 完了 -->
<div id="screen-complete" class="screen">
  <div class="complete-icon">✅</div>
  <h2>記録しました</h2>
  <div class="complete-summary">
    <div id="complete-rows"></div>
    <div class="row" style="margin-top:8px;font-size:16px">
      <span>合計</span>
      <span class="val" id="complete-total"></span>
    </div>
    <div class="row">
      <span>決済</span>
      <span class="val" id="complete-payment"></span>
    </div>
  </div>
  <span id="sync-status" class="sync-status"></span>
  <button id="next-btn" class="next-btn">次の販売へ</button>
</div>

<!-- Ecobag Variant Bottom Sheet -->
<div id="ecobag-modal" class="variant-sheet hidden">
  <div class="variant-sheet-inner">
    <div class="variant-sheet-header">
      <h3>👜 エコバッグを選択</h3>
      <button id="ecobag-modal-close" class="variant-sheet-close">✕</button>
    </div>
    <div id="ecobag-variant-grid" class="variant-grid"></div>
  </div>
</div>

<!-- Scanner Modal -->
<div id="scanner-modal" class="scanner-modal hidden">
  <p style="color:#fff;font-size:15px">バーコードをカメラに向けてください</p>
  <video id="scanner-video" playsinline></video>
  <button id="scanner-close" class="scanner-close">キャンセル</button>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script type="module">
  import './js/app.js';
  import { startScanner, stopScanner } from './js/scanner.js';

  document.getElementById('scan-btn').addEventListener('click', startScanner);
  document.getElementById('scanner-close').addEventListener('click', stopScanner);
</script>
</body>
</html>
