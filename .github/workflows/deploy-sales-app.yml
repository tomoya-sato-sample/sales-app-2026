name: Deploy Sales App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'sales-app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update CACHE_VERSION with build timestamp
        run: |
          BUILD_TS=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = '${BUILD_TS}'/" sales-app/sw.js
          echo "CACHE_VERSION set to ${BUILD_TS}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sales-app/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
